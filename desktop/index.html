<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aKUl &middot; compare API key limits</title>
<style>
  :root{
    --radius:12px;
    --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  /* ---------- dark (default): pure black & white ---------- */
  html[data-theme="dark"]{
    --bg:#000; --panel:#0a0a0a; --panel-2:#050505; --sunken:#000;
    --line:#242424; --line-strong:#3d3d3d;
    --text:#fff; --text-dim:#a3a3a3; --text-faint:#6b6b6b;
    --inv-bg:#fff; --inv-text:#000;
    --bar:#fff; --bar-empty:#1c1c1c;
    --fill:rgba(255,255,255,.08); --fill-strong:rgba(255,255,255,.16);
  }
  /* ---------- light: pure white & black ---------- */
  html[data-theme="light"]{
    --bg:#fff; --panel:#fafafa; --panel-2:#fff; --sunken:#fff;
    --line:#e2e2e2; --line-strong:#bdbdbd;
    --text:#000; --text-dim:#5f5f5f; --text-faint:#9a9a9a;
    --inv-bg:#000; --inv-text:#fff;
    --bar:#000; --bar-empty:#e8e8e8;
    --fill:rgba(0,0,0,.045); --fill-strong:rgba(0,0,0,.12);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 var(--sans);
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex; align-items:center; gap:14px; padding:13px 20px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;
  }
  .logo{font-weight:800; font-size:20px; letter-spacing:.6px; color:var(--text)}
  .tag{color:var(--text-dim); font-size:12.5px}
  .spacer{flex:1}
  .pill{
    font-size:11.5px; padding:3px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--text-dim); background:var(--panel-2);
  }
  .pill b{color:var(--text); font-variant-numeric:tabular-nums}

  /* theme toggle */
  .toggle{
    display:inline-flex; align-items:center; gap:8px;
    padding:4px 4px 4px 11px; border:1px solid var(--line);
    border-radius:999px; background:var(--panel-2); cursor:pointer;
    color:var(--text-dim); font-size:11.5px; font-weight:600;
    font-family:var(--sans);
  }
  .toggle:hover{border-color:var(--line-strong); color:var(--text)}
  .knob{
    width:34px; height:18px; border-radius:999px; background:var(--sunken);
    border:1px solid var(--line-strong); position:relative; transition:background .18s ease;
  }
  .knob::after{
    content:""; position:absolute; top:1px; left:1px; width:14px; height:14px;
    border-radius:50%; background:var(--text);
    transition:transform .18s ease;
  }
  html[data-theme="light"] .knob::after{transform:translateX(16px)}
  .toggle .lbl-dark{display:inline}
  .toggle .lbl-light{display:none}
  html[data-theme="light"] .toggle .lbl-dark{display:none}
  html[data-theme="light"] .toggle .lbl-light{display:inline}

  .panel{padding:16px 20px; border-bottom:1px solid var(--line); background:var(--panel-2)}
  label{
    display:block; font-size:11px; text-transform:uppercase;
    letter-spacing:.7px; color:var(--text-dim); margin-bottom:6px; font-weight:600;
  }
  textarea,input,select{
    background:var(--sunken); color:var(--text); border:1px solid var(--line);
    border-radius:10px; font-family:var(--mono); font-size:12.5px;
  }
  textarea{width:100%; min-height:82px; resize:vertical; padding:10px 12px}
  input,select{padding:8px 10px; font-family:var(--sans); font-size:13px; width:100%}
  textarea:focus,input:focus,select:focus{outline:none; border-color:var(--text)}
  textarea::placeholder,input::placeholder{color:var(--text-faint)}

  .row{display:flex; gap:12px; align-items:flex-end; margin-top:12px; flex-wrap:wrap}
  .field{display:flex; flex-direction:column; min-width:150px}
  .field.grow{flex:1; min-width:260px}

  button{
    padding:9px 18px; border-radius:9px; border:1px solid var(--text);
    background:var(--text); color:var(--inv-text);
    font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans);
    white-space:nowrap;
  }
  button:hover{opacity:.86}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:transparent; color:var(--text-dim); border-color:var(--line); font-weight:600}
  button.ghost:hover{color:var(--text); border-color:var(--text); opacity:1}

  main{flex:1; overflow:auto; padding:18px 20px 40px}
  .banner{
    display:none; margin:14px 20px 0; padding:12px 14px; border-radius:10px;
    border:1px solid var(--line-strong); background:var(--fill); color:var(--text); font-size:13px;
  }
  .banner.show{display:block}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--bar)}
  .card.bad::before{background:transparent}
  .card.bad{border-style:dashed}
  .card.warn::before{background:repeating-linear-gradient(180deg,var(--bar) 0 4px,transparent 4px 8px)}
  .card-head{display:flex; align-items:center; gap:8px}
  .key{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text)}
  .badge{
    font-size:10.5px; font-weight:800; letter-spacing:.6px; padding:3px 8px;
    border-radius:999px; margin-left:auto; border:1px solid var(--text);
    color:var(--inv-text); background:var(--text);
  }
  .badge.bad{background:transparent; color:var(--text-dim); border-color:var(--line-strong)}
  .badge.warn{background:transparent; color:var(--text); border-style:dashed}
  .meta{color:var(--text-dim); font-size:11.5px; margin:2px 0 12px}
  .crown{
    position:absolute; right:12px; bottom:10px; font-size:10.5px; font-weight:800;
    letter-spacing:.5px; color:var(--inv-text); background:var(--text);
    padding:2px 8px; border-radius:999px;
  }

  .section{margin-top:14px}
  .section h4{
    margin:0 0 7px; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.8px; color:var(--text-dim); font-weight:700;
  }
  .bar{height:8px; border-radius:99px; background:var(--bar-empty); overflow:hidden}
  .bar>i{display:block; height:100%; background:var(--bar); transition:width .4s ease}
  .bar-row{display:flex; align-items:center; gap:9px; margin-top:5px}
  .bar-row .bar{flex:1}
  .bar-row .pct{font-size:11.5px; font-weight:700; width:44px; text-align:right; font-variant-numeric:tabular-nums}
  .sub{color:var(--text-dim); font-size:11px; margin-top:6px}

  table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:2px}
  th,td{text-align:left; padding:6px; border-bottom:1px solid var(--line)}
  th{color:var(--text-dim); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px}
  td.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
  .win{font-weight:800; color:var(--text); background:var(--fill); border-radius:4px}
  .empty{color:var(--text-dim); text-align:center; padding:60px 20px; font-size:14px}
  .spin{display:inline-block; animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <span class="logo">aKUl</span>
    <span class="tag">compare API key limits</span>
    <span class="spacer"></span>
    <span class="pill">keys <b id="keyCount">0</b></span>
    <span class="pill">valid <b id="validCount">&ndash;</b></span>
    <button class="toggle" id="themeBtn" title="Switch between light and dark">
      <span class="lbl-dark">Dark</span><span class="lbl-light">Light</span>
      <span class="knob"></span>
    </button>
  </header>

  <div class="panel">
    <label for="keys">API keys &mdash; one per line</label>
    <textarea id="keys" placeholder="thk_live_...&#10;sk-proj-...&#10;sk-ant-..."></textarea>

    <div class="row">
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider"></select>
      </div>
      <div class="field grow">
        <label for="baseUrl">Custom base URL &mdash; optional</label>
        <input id="baseUrl" placeholder="e.g. https://my-gateway.example.com/v1">
      </div>
      <div class="field">
        <label for="workers">Workers</label>
        <select id="workers">
          <option>3</option><option selected>5</option><option>8</option><option>12</option>
        </select>
      </div>
      <button id="check">Check keys</button>
      <button id="clear" class="ghost">Clear</button>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <main>
    <div id="cards" class="cards"></div>
    <div class="empty" id="empty">
      Paste one or more API keys above and press <b>Check keys</b> to compare their limits side by side.
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmt = (n) => {
  if (n === null || n === undefined) return "&minus;";
  if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"") + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return String(n);
};

/* ---- theme ---- */
const THEME_KEY = "akul.theme";
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  try { localStorage.setItem(THEME_KEY, mode); } catch(e){}
}
$("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(saved === "light" ? "light" : "dark");
})();

/* ---- inputs ---- */
$("keys").addEventListener("input", () => {
  const n = $("keys").value.split("\n").filter(l => l.trim() && !l.trim().startsWith("#")).length;
  $("keyCount").textContent = n;
});

$("provider").addEventListener("focus", loadProviders, {once:true});
async function loadProviders(){
  try{
    const d = await (await fetch("/api/providers")).json();
    $("provider").innerHTML = d.providers.map(p =>
      `<option value="${esc(p.name)}">${esc(p.name === "auto" ? "auto (detect)" : p.label)}</option>`
    ).join("");
  }catch(e){/* keep default */}
}

/* ---- rendering ---- */
function bar(pctRemaining, label){
  const p = Math.max(0, Math.min(100, pctRemaining ?? 0));
  return `<div class="bar-row">
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="pct">${label}</div>
  </div>`;
}

function card(key, winners){
  const cls  = key.valid === true ? "ok" : key.valid === false ? "bad" : "warn";
  const text = key.valid === true ? "VALID" : key.valid === false ? "INVALID" : "UNKNOWN";
  let html = `<div class="card ${cls}">
    <div class="card-head">
      <span class="key">${esc(key.key)}</span>
      <span class="badge ${cls}">${text}</span>
    </div>
    <div class="meta">${esc(key.provider)} &middot; HTTP ${key.status}</div>`;

  const a = key.allowance;
  if(a && ((a.remaining_pct !== null && a.remaining_pct !== undefined) || a.resets_in)){
    const has = a.remaining_pct !== null && a.remaining_pct !== undefined;
    html += `<div class="section"><h4>Free allowance</h4>
      ${bar(a.remaining_pct, has ? `${Math.round(a.remaining_pct)}%` : "n/a")}
      <div class="sub">${a.resets_in ? "resets in " + esc(a.resets_in) : ""}${a.plan ? " &middot; plan " + esc(a.plan) : ""}</div>
    </div>`;
    if(winners["free allowance"] === key.__i) html += `<span class="crown">MOST LEFT</span>`;
  }

  if(key.buckets && key.buckets.length){
    html += `<div class="section"><h4>Rate limits</h4><table><thead><tr>
      <th>Bucket</th><th style="text-align:right">Limit</th><th style="text-align:right">Left</th></tr></thead><tbody>`;
    for(const b of key.buckets){
      const hasRem = b.remaining !== null && b.remaining !== undefined;
      const isWin = winners[b.name] === key.__i && hasRem;
      html += `<tr><td>${esc(b.name)}</td>
        <td class="num">${fmt(b.limit)}</td>
        <td class="num ${isWin ? "win" : ""}">${fmt(b.remaining)}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  if(key.message) html += `<div class="section"><div class="sub">${esc(key.message)}</div></div>`;
  return html + `</div>`;
}

function render(d){
  $("validCount").textContent = d.valid_count;
  $("empty").style.display = "none";
  $("cards").innerHTML = d.keys.map((k,i)=>{ k.__i = i; return card(k, d.winners); }).join("");
}

function showBanner(msg){
  const b = $("banner"); b.textContent = msg; b.classList.add("show");
}

/* ---- run ---- */
async function run(){
  const text = $("keys").value;
  const keys = text.split("\n").map(l=>l.trim()).filter(l=>l && !l.startsWith("#"));
  $("banner").classList.remove("show");
  if(!keys.length){ showBanner("Add at least one API key."); return; }

  const btn = $("check");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">&#9696;</span> Checking';

  try{
    const r = await fetch("/api/check", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        text,
        provider:$("provider").value,
        base_url:$("baseUrl").value.trim(),
        workers:Number($("workers").value),
        timeout:30
      })
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    render(d);
  }catch(e){
    showBanner(e.message || String(e));
  }finally{
    btn.disabled = false;
    btn.textContent = "Check keys";
  }
}

$("check").addEventListener("click", run);
$("clear").addEventListener("click", ()=>{
  $("keys").value = ""; $("cards").innerHTML = "";
  $("empty").style.display = ""; $("keyCount").textContent = "0";
  $("validCount").textContent = "–";
  $("banner").classList.remove("show");
});

loadProviders();
</script>
</body>
</html>
