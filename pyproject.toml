[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keylimits"
version = "0.1.0"
description = "Check the rate limits and validity of an API key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["api", "rate-limit", "quota", "openai", "anthropic", "groq", "gemini", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
keylimits = "keylimits.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["keylimits*"]